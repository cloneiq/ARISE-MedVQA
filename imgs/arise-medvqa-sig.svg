<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ARISE-MedVQA Banner</title>
  <desc id="desc">Banner for ARISE-MedVQA, a curated academic resource hub for Medical Visual Question Answering, centered on the theme from passive answering to active inquiry.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>

    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 90) rotate(35) scale(290 170)">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 170) rotate(-25) scale(320 180)">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="line" x1="150" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFDBFE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0F2FE" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="28" fill="url(#glow1)"/>
  <rect width="1200" height="260" rx="28" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <g opacity="0.10">
    <path d="M80 40H1120" stroke="#E2E8F0"/>
    <path d="M80 90H1120" stroke="#E2E8F0"/>
    <path d="M80 140H1120" stroke="#E2E8F0"/>
    <path d="M80 190H1120" stroke="#E2E8F0"/>
    <path d="M160 25V235" stroke="#E2E8F0"/>
    <path d="M320 25V235" stroke="#E2E8F0"/>
    <path d="M480 25V235" stroke="#E2E8F0"/>
    <path d="M640 25V235" stroke="#E2E8F0"/>
    <path d="M800 25V235" stroke="#E2E8F0"/>
    <path d="M960 25V235" stroke="#E2E8F0"/>
  </g>

  <!-- Left knowledge-resource motif -->
  <g filter="url(#softShadow)" opacity="0.95">
    <rect x="108" y="68" width="64" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.10" stroke="#BFDBFE" stroke-opacity="0.5"/>
    <path d="M122 82H158" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round"/>
    <path d="M122 93H150" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round"/>
    <path d="M122 104H154" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round"/>
    <circle cx="198" cy="142" r="8" fill="#CCFBF1"/>
    <circle cx="122" cy="168" r="6" fill="#BFDBFE"/>
    <path d="M166 104L192 136" stroke="#CCFBF1" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M140 112L126 162" stroke="#BFDBFE" stroke-width="2" stroke-opacity="0.45"/>
  </g>

  <!-- Right inquiry motif -->
  <g filter="url(#softShadow)" opacity="0.95">
    <circle cx="1055" cy="84" r="21" fill="#FFFFFF" fill-opacity="0.10" stroke="#A7F3D0" stroke-opacity="0.55"/>
    <path d="M1049 80C1049 76.7 1051.8 74 1055.4 74C1059.1 74 1061.8 76.4 1061.8 79.8C1061.8 82.3 1060.3 84 1057.8 85.6C1055.8 86.9 1054.8 88.1 1054.8 90.5" stroke="#D1FAE5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1055" cy="96.5" r="2.5" fill="#D1FAE5"/>
    <circle cx="1000" cy="151" r="6" fill="#BFDBFE"/>
    <circle cx="1089" cy="160" r="7" fill="#CCFBF1"/>
    <path d="M1042 101L1004 146" stroke="#BFDBFE" stroke-width="2" stroke-opacity="0.45"/>
    <path d="M1067 101L1085 153" stroke="#CCFBF1" stroke-width="2" stroke-opacity="0.45"/>
  </g>

  <!-- Pill label -->
  <g transform="translate(425 30)">
    <rect width="350" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#DBEAFE" stroke-opacity="0.35"/>
    <text x="175" y="22" text-anchor="middle"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="14" font-weight="700" letter-spacing="1.4"
          fill="#E0F2FE">CURATED ACADEMIC RESOURCE HUB</text>
  </g>

  <!-- Main title -->
  <text x="600" y="120" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="1.2"
        fill="#FFFFFF">ARISE-MedVQA</text>

  <!-- Subtitle -->
  <text x="600" y="156" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="600"
        fill="#E0F2FE">From Passive Answering to Active Inquiry</text>

  <!-- Supporting line -->
  <text x="600" y="188" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="15" font-weight="500"
        fill="#D1FAE5">Evidence-Driven · Risk-Aware · Explainable · Verifiable · Interactive Medical Reasoning</text>

  <!-- Accent line -->
  <path d="M150 216H1050" stroke="url(#line)" stroke-width="2"/>

  <!-- Bottom keywords -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#E0F2FE" opacity="0.92">
    <text x="260" y="238" text-anchor="middle">Surveys</text>
    <text x="390" y="238" text-anchor="middle">Datasets</text>
    <text x="510" y="238" text-anchor="middle">Metrics</text>
    <text x="640" y="238" text-anchor="middle">Methods</text>
    <text x="790" y="238" text-anchor="middle">MLLMs</text>
    <text x="920" y="238" text-anchor="middle">Medical Agents</text>
  </g>
</svg>
