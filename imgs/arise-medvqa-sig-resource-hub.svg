<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ARISE-MedVQA Resource Hub Banner</title>
  <desc id="desc">Banner for ARISE-MedVQA, a curated and continuously updated academic resource repository for Medical Visual Question Answering.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.45" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 80) rotate(30) scale(280 160)">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(955 168) rotate(-22) scale(330 185)">
      <stop offset="0" stop-color="#99F6E4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#99F6E4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="140" y1="0" x2="1060" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFDBFE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E0F2FE" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="28" fill="url(#glowLeft)"/>
  <rect width="1200" height="260" rx="28" fill="url(#glowRight)"/>

  <!-- Subtle library shelves -->
  <g opacity="0.10">
    <path d="M90 50H1110" stroke="#E2E8F0"/>
    <path d="M90 98H1110" stroke="#E2E8F0"/>
    <path d="M90 146H1110" stroke="#E2E8F0"/>
    <path d="M90 194H1110" stroke="#E2E8F0"/>
  </g>

  <!-- Left: resource cards / literature index -->
  <g filter="url(#shadow)" opacity="0.96">
    <rect x="92" y="63" width="70" height="88" rx="12" fill="#FFFFFF" fill-opacity="0.11" stroke="#BFDBFE" stroke-opacity="0.50"/>
    <rect x="176" y="82" width="70" height="88" rx="12" fill="#FFFFFF" fill-opacity="0.09" stroke="#CCFBF1" stroke-opacity="0.45"/>
    <rect x="120" y="113" width="70" height="88" rx="12" fill="#FFFFFF" fill-opacity="0.12" stroke="#DBEAFE" stroke-opacity="0.50"/>

    <path d="M108 84H146" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round"/>
    <path d="M108 98H137" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round"/>
    <path d="M108 112H143" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round"/>

    <path d="M192 103H230" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>
    <path d="M192 117H222" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>
    <path d="M192 131H228" stroke="#CCFBF1" stroke-width="3" stroke-linecap="round"/>

    <path d="M136 135H174" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
    <path d="M136 149H167" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
    <path d="M136 163H172" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right: taxonomy map / curated hub -->
  <g filter="url(#shadow)" opacity="0.96">
    <circle cx="1036" cy="92" r="9" fill="#DBEAFE"/>
    <circle cx="982" cy="143" r="8" fill="#CCFBF1"/>
    <circle cx="1092" cy="143" r="8" fill="#BFDBFE"/>
    <circle cx="1036" cy="196" r="9" fill="#A7F3D0"/>
    <path d="M1036 101L987 137" stroke="#E0F2FE" stroke-width="2" stroke-opacity="0.48"/>
    <path d="M1036 101L1087 137" stroke="#E0F2FE" stroke-width="2" stroke-opacity="0.48"/>
    <path d="M982 151L1030 190" stroke="#CCFBF1" stroke-width="2" stroke-opacity="0.48"/>
    <path d="M1092 151L1042 190" stroke="#CCFBF1" stroke-width="2" stroke-opacity="0.48"/>
    <rect x="1002" y="118" width="69" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.10" stroke="#CCFBF1" stroke-opacity="0.35"/>
    <text x="1036.5" y="138" text-anchor="middle"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="700" fill="#E0F2FE">Index</text>
  </g>

  <!-- Pill label -->
  <g transform="translate(405 30)">
    <rect width="390" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#DBEAFE" stroke-opacity="0.38"/>
    <text x="195" y="22" text-anchor="middle"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="14" font-weight="700" letter-spacing="1.45"
          fill="#E0F2FE">LITERATURE · DATASETS · BENCHMARKS</text>
  </g>

  <!-- Main title -->
  <text x="600" y="118" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="1.2"
        fill="#FFFFFF">ARISE-MedVQA</text>

  <!-- Resource hub subtitle -->
  <text x="600" y="154" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="650"
        fill="#E0F2FE">A Curated Academic Resource Hub for Medical Visual Question Answering</text>

  <!-- Theme line -->
  <text x="600" y="187" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="15" font-weight="500"
        fill="#D1FAE5">Surveys · Datasets · Metrics · Methods · MLLMs · Medical Agents · Code Resources</text>

  <!-- Accent line -->
  <path d="M140 216H1060" stroke="url(#line)" stroke-width="2"/>

  <!-- Bottom theme -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#E0F2FE" opacity="0.92">
    <text x="318" y="238" text-anchor="middle">Continuously Updated</text>
    <text x="520" y="238" text-anchor="middle">Structured Taxonomy</text>
    <text x="720" y="238" text-anchor="middle">Research Navigation</text>
    <text x="912" y="238" text-anchor="middle">From Passive Answering to Active Inquiry</text>
  </g>
</svg>
